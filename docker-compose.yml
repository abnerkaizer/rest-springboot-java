services:
  db:
    image: mysql:8.4.6
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: rest_springboot_java
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rest-network

  rest-springboot-java:
    image: abnerkaizer/rest-springboot-java
    build: ./
    restart: always
    environment:
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/rest_springboot_java?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_FLYWAY_CONNECT_RETRIES: 10
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rest-network

networks:
  rest-network:
    driver: bridge


services:
  db:
    image: mysql:8.4.6
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_USER: docker
      MYSQL_PASSWORD: admin123
      MYSQL_DATABASE: rest-springboot-java
    ports:
      - "3308:3306"
    expose:
      - 3306
    networks:
      - rest-network
  rest-with-spring-boot-erudio:
    image: abnerkaizer/rest-springboot-java
    restart: always
    build: ./
    environment:
      TZ: America/Sao_Paulo
      SPRING.DATASOURCE.URL: jdbc:mysql://db:3306/rest-springboot-java?useTimezone=true&serverTimezone=UTC
      SPRING.DATASOURCE.USERNAME: root
      SPRING.DATASOURCE.PASSWORD: admin123
    command: mvn spring-boot:run
    ports:
      - "80:8080"
    expose:
      - 80
    depends_on:
      - db
    networks:
      - rest-network

networks:
  rest-network:
    driver: bridge


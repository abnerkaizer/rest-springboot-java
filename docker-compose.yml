services:
  db:
    image: mysql:8.4.6
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_USER: docker
      MYSQL_PASSWORD: admin123
      MYSQL_DATABASE: rest_springboot_java
    ports:
      - "3308:3306"
    expose:
      - 3306
    networks:
      - rest-network

  rest-springboot-java:
    image: abnerkaizer/rest-springboot-java
    build: ./
    restart: always
    environment:
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/rest_springboot_java?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin123
    command: mvn spring-boot:run
    ports:
      - "80:80"
    depends_on:
      - db
    networks:
      - rest-network

networks:
  rest-network:
    driver: bridge

